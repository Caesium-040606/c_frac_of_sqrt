<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>코드 뷰어</title>
<style>
  body {
    background: #1e1e1e;
    color: #d4d4d4;
    font-family: Consolas, monospace;
  }
  pre {
    padding: 20px;
    white-space: pre-wrap;
  }
</style>
</head>
<body>

<pre><code id="code"></code></pre>

<script>
const code = `#include <cstdio>
#include <cmath>

int arr[10000];

int main()
{
    int n;
    scanf("%d", &n);
    int a_0=(int)sqrt(n);
    if(a_0*a_0==n)
    {
        printf("Square Number");
        return 0;
    }

    int m=0, p=1, a=a_0;
    int len=0;

    do
    {
        m=a*p-m;
        p=(n-(m*m))/p;
        a=(a_0+m)/p;
        arr[len++]=a;
    }while(a!=2*a_0);

    printf("[%d;",a_0);
    for(int i=0;i<len;i++)
    {
        printf("%d", arr[i]);
        if(i!=len-1)
        {
            printf(",");
        }
    }
    printf("]");
    return 0;
}`;
document.getElementById("code").innerText = code;
</script>

</body>
</html>
